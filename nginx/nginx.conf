events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;

  # Drop-in site configs (e.g. conf.d/ssl.conf for the HTTPS server).
  # Mounted from ./nginx/conf.d — this also shadows the image's default site.
  include /etc/nginx/conf.d/*.conf;

  # Upload size
  client_max_body_size 100M;

  # Logging
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;
  error_log /var/log/nginx/error.log warn;

  # Performance
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  gzip on;
  gzip_vary on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

  # Static asset cache (generated JS/CSS with hashed filenames)
  map $uri $cache_control {
    ~*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webm)$ "public, max-age=31536000, immutable";
    default "public, max-age=300";
  }

  # Upstream API
  upstream api {
    server api:3001;
  }

  server {
    listen 80;
    server_name _;

    # Let's Encrypt ACME challenge (used for certificate renewals).
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    # Everything else goes to HTTPS once conf.d/ssl.conf is in place.
    # (certbot standalone handles the very first certificate, before the
    # stack is running.)
    location / {
      return 301 https://$host$request_uri;
    }
  }
}
