name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: silent_review
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/silent_review
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-jwt-secret-that-is-at-least-32-characters-long
      JWT_REFRESH_SECRET: test-refresh-secret-that-is-at-least-32-characters-long
      WEB_APP_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm --filter shared build && pnpm --filter database build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Build
        run: pnpm build

      - name: Unit tests (API)
        run: pnpm --filter api test 2>&1 | tee api-test-output.log

      - name: Upload API test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-output
          path: api-test-output.log
          retention-days: 7

      - name: Unit tests (Web)
        run: pnpm --filter web test

  e2e:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: silent_review
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/silent_review
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      JWT_SECRET: test-jwt-secret-that-is-at-least-32-characters-long
      JWT_REFRESH_SECRET: test-refresh-secret-that-is-at-least-32-characters-long
      WEB_APP_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Build packages
        run: pnpm --filter shared build && pnpm --filter database build && pnpm --filter api build && pnpm --filter web build

      - name: Apply database migrations
        run: pnpm --filter database run deploy

      - name: Seed database
        run: pnpm db:seed

      - name: Start API and Web
        run: |
          pnpm --filter api start &
          pnpm --filter web run preview --port 5173 &
          for i in {1..60}; do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/health | grep -q "200" && \
               curl -s -o /dev/null -w "%{http_code}" http://localhost:5173/login | grep -q "200"; then
              echo "Servers are ready"
              break
            fi
            echo "Waiting for servers... ($i)"
            sleep 2
          done
          if ! curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/health | grep -q "200" || \
             ! curl -s -o /dev/null -w "%{http_code}" http://localhost:5173/login | grep -q "200"; then
            echo "Servers did not become ready in time"
            exit 1
          fi

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
